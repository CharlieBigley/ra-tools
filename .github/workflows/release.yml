name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    paths:
      - 'plg_system_ra_tools/**'
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' plg_system_ra_tools/plg_system_ra_tools.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create zip
        run: |
          zip -r plg_system_ra_tools.zip plg_system_ra_tools/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## plg_system_ra_tools v${{ steps.version.outputs.version }}

            System plugin for RA Tools - Cascade deletes related records from `ra_emails` and `ra_profiles` tables when a user is deleted.

            ### Installation
            1. Download `plg_system_ra_tools.zip`
            2. Install via Joomla Extensions > Manage > Install
            3. Enable the plugin in Extensions > Plugins
          files: plg_system_ra_tools.zip
          make_latest: true
